  <script>
    const memberCount = document.getElementById('member-count');
    const loadMoreMembersBtn = document.getElementById('load-more-members');
    const defaultVisibleMemberCount = 3;
    let isAllMembersVisible = false;

    function updateMemberCount() {
      memberCount.textContent = document.querySelectorAll('.member-card').length;
    }

    function updateVisibleMembers() {
      const cards = Array.from(document.querySelectorAll('.member-card'));

      cards.forEach((card, index) => {
        if (isAllMembersVisible || index < defaultVisibleMemberCount) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });

      if (cards.length <= defaultVisibleMemberCount || isAllMembersVisible) {
        loadMoreMembersBtn.classList.add('hidden');
      } else {
        loadMoreMembersBtn.classList.remove('hidden');
      }
    }

    loadMoreMembersBtn.addEventListener('click', () => {
      isAllMembersVisible = true;
      updateVisibleMembers();
    });

    updateMemberCount();
    updateVisibleMembers();
  </script>
