<!DOCTYPE html><html lang="zh-CN" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#0e0200",
                        "inverse-surface": "#2d3038",
                        "secondary": "#006e2c",
                        "outline": "#727785",
                        "inverse-on-surface": "#eff0fa",
                        "surface-variant": "#e0e2ec",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#e0e2ec",
                        "surface": "#f9f9ff",
                        "on-tertiary-fixed": "#341100",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#adc7ff",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#004493",
                        "surface-tint": "#005bc0",
                        "tertiary": "#9e4300",
                        "on-secondary": "#ffffff",
                        "primary": "#005bbf",
                        "secondary-container": "#86f898",
                        "outline-variant": "#c1c6d6",
                        "secondary-fixed-dim": "#6ddd81",
                        "on-surface": "#191c23",
                        "surface-container-high": "#e6e8f2",
                        "error-container": "#ffdad6",
                        "surface-container": "#ecedf7",
                        "primary-container": "#1a73e8",
                        "tertiary-container": "#c55500",
                        "on-secondary-fixed": "#002108",
                        "primary-fixed": "#d8e2ff",
                        "on-primary-container": "#ffffff",
                        "on-primary-fixed": "#001a41",
                        "on-secondary-fixed-variant": "#005320",
                        "surface-container-low": "#f2f3fd",
                        "on-surface-variant": "#414754",
                        "on-secondary-container": "#00722f",
                        "on-tertiary-fixed-variant": "#783100",
                        "surface-dim": "#d8d9e3",
                        "background": "#f9f9ff",
                        "tertiary-fixed-dim": "#ffb691",
                        "on-error-container": "#93000a",
                        "on-background": "#191c23",
                        "tertiary-fixed": "#ffdbcb",
                        "secondary-fixed": "#89fa9b",
                        "surface-bright": "#f9f9ff",
                        "primary-fixed-dim": "#adc7ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "grid-gutter": "1px",
                        "container-padding": "16px",
                        "card-gap": "12px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9ff;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    html, body {
      overflow-y: auto;
      overflow-x: hidden;
    }
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Top Branding Section -->
<header class="fixed top-0 w-full bg-surface dark:bg-surface-dim shadow-sm z-50">
<div class="flex items-center justify-between px-container-padding h-16 w-full max-w-7xl mx-auto">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="shield_person">shield_person</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary">心理健康教育咨询中心</h1>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-container-padding pt-24 pb-12">
<div class="w-full max-w-md">
<!-- Welcome Header -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-primary-fixed mb-6 shadow-sm">
<span class="material-symbols-outlined text-primary text-[40px]" data-icon="lock">lock</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">欢迎登录</h2>
<p class="font-body-md text-body-md text-on-surface-variant">请使用您的账户访问系统</p>
</div>
<!-- Login Form -->
<form id="login-form" class="space-y-6" novalidate>
<!-- Account Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="account">账号</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px] group-focus-within:text-primary transition-colors" data-icon="person">person</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-surface-container-lowest border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-xl font-body-lg text-body-lg transition-all" id="account" name="account" placeholder="请输入工号或账号" type="text">
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="password">密码</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px] group-focus-within:text-primary transition-colors" data-icon="key">key</span>
</div>
<input class="block w-full pl-12 pr-12 py-4 bg-surface-container-lowest border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-xl font-body-lg text-body-lg transition-all" id="password" name="password" placeholder="请输入您的登录密码" type="password">
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline-variant hover:text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>

<!-- Login Error Message -->
<p id="login-error" class="hidden font-label-md text-label-md text-error text-center">账号或密码错误，请重新输入</p>
<!-- Login Button -->
<div class="pt-4">
<button class="w-full h-[50px] bg-primary-container text-on-primary-container font-headline-md text-headline-md rounded-full shadow-sm hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        登录
                        <span class="material-symbols-outlined" data-icon="login">login</span>
</button>
</div>
</form>
<!-- Secondary Actions -->
<div class="mt-8 flex flex-col items-center gap-4">
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">忘记密码？</a>
<div class="w-full flex items-center gap-4 my-2">
<div class="h-px flex-grow bg-outline-variant"></div>
<span class="font-label-md text-label-md text-outline">或者</span>
<div class="h-px flex-grow bg-outline-variant"></div>
</div>
<button class="w-full py-3 flex items-center justify-center gap-2 font-body-md text-body-md text-on-surface-variant bg-surface-container rounded-xl hover:bg-surface-container-high transition-colors active:scale-[0.99]">
<span class="material-symbols-outlined text-[18px]" data-icon="support_agent">support_agent</span>
                    联系管理员
                </button>
</div>
</div>
</main>
<!-- Bottom Aesthetic / Footer -->
<footer class="pb-safe pt-4 px-container-padding text-center">
<p class="font-label-md text-label-md text-outline py-6">
            © 2024 Duty Manager System • 安全可靠的调度管理
        </p>
</footer>
<!-- Background Decoration -->
<div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden">
<div class="absolute -top-[10%] -right-[10%] w-[40%] h-[40%] rounded-full bg-primary-fixed/20 blur-[100px]"></div>
<div class="absolute -bottom-[10%] -left-[10%] w-[30%] h-[30%] rounded-full bg-secondary-fixed/10 blur-[80px]"></div>
</div>

<script>
  const loginForm = document.getElementById('login-form');
  const accountInput = document.getElementById('account');
  const passwordInput = document.getElementById('password');
  const loginError = document.getElementById('login-error');
  const visibilityButton = document.querySelector('button[type="button"]');
  const visibilityIcon = visibilityButton ? visibilityButton.querySelector('.material-symbols-outlined') : null;

  const users = {
    '20241031': { password: '123123', target: 'managerMainPage.html' },
    '20220001': { password: '1234567', target: 'assistanceMainPage.html' }
  };

  loginForm.addEventListener('submit', function (event) {
    event.preventDefault();

    const account = accountInput.value.trim();
    const password = passwordInput.value.trim();
    const user = users[account];

    if (user && user.password === password) {
      loginError.classList.add('hidden');
      window.location.href = user.target;
    } else {
      loginError.textContent = '账号或密码错误，请重新输入';
      loginError.classList.remove('hidden');
    }
  });

  if (visibilityButton) {
    visibilityButton.addEventListener('click', function () {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      if (visibilityIcon) {
        visibilityIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      }
    });
  }
</script>

</body></html>
