<script>
  function setSlotState(slot, available) {
    const statusText = slot.querySelector('.slot-status');
    const timeText = slot.querySelector('.slot-time');

    slot.dataset.available = available ? 'true' : 'false';

    if (available) {
      slot.classList.remove(
        'border-outline-variant',
        'bg-surface-container-lowest',
        'text-on-surface',
        'hover:bg-surface-container-high'
      );

      slot.classList.add(
        'border-primary',
        'bg-secondary-container',
        'text-on-secondary-container',
        'shadow-sm'
      );

      statusText.textContent = '有空';
      statusText.classList.add('font-bold');
      timeText.classList.remove('text-on-surface-variant');
    } else {
      slot.classList.remove(
        'border-primary',
        'bg-secondary-container',
        'text-on-secondary-container',
        'shadow-sm'
      );

      slot.classList.add(
        'border-outline-variant',
        'bg-surface-container-lowest',
        'text-on-surface',
        'hover:bg-surface-container-high'
      );

      statusText.textContent = '没空';
      statusText.classList.remove('font-bold');
      timeText.classList.add('text-on-surface-variant');
    }
  }

  document.querySelectorAll('.time-slot').forEach(slot => {
    slot.addEventListener('click', () => {
      const currentState = slot.dataset.available === 'true';
      setSlotState(slot, !currentState);
    });
  });
</script>
