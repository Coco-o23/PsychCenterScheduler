  <script>
    // 默认空闲时间：更新设置 / 确认更改
    const editDefaultButton = document.getElementById('edit-default-availability');
    const defaultSlots = document.querySelectorAll('.default-slot');
    let isEditingDefaultAvailability = false;

    function setDefaultSlotState(slot, active) {
      const dot = slot.querySelector('.slot-dot');
      slot.dataset.active = active ? 'true' : 'false';

      if (active) {
        slot.classList.remove('bg-white');
        slot.classList.add('bg-primary-container/10');
        dot.classList.remove('hidden');
      } else {
        slot.classList.remove('bg-primary-container/10');
        slot.classList.add('bg-white');
        dot.classList.add('hidden');
      }
    }

    editDefaultButton.addEventListener('click', () => {
      isEditingDefaultAvailability = !isEditingDefaultAvailability;

      if (isEditingDefaultAvailability) {
        editDefaultButton.textContent = '确认更改';
        defaultSlots.forEach(slot => {
          slot.disabled = false;
          slot.classList.add('cursor-pointer');
        });
      } else {
        editDefaultButton.textContent = '更新设置';
        defaultSlots.forEach(slot => {
          slot.disabled = true;
          slot.classList.remove('cursor-pointer');
        });
      }
    });

    defaultSlots.forEach(slot => {
      slot.addEventListener('click', () => {
        if (!isEditingDefaultAvailability) return;
        const currentState = slot.dataset.active === 'true';
        setDefaultSlotState(slot, !currentState);
      });
    });

    // 默认排班设置：每周工作时间
    const openWorkdaysModal = document.getElementById('open-workdays-modal');
    const workdaysModal = document.getElementById('workdays-modal');
    const closeWorkdaysModal = document.getElementById('close-workdays-modal');
    const cancelWorkdays = document.getElementById('cancel-workdays');
    const saveWorkdays = document.getElementById('save-workdays');
    const workdaysSummary = document.getElementById('workdays-summary');
    const workdayOptions = document.querySelectorAll('.workday-option');

    // 默认排班设置：默认班次时长
    const openShiftsModal = document.getElementById('open-shifts-modal');
    const shiftsModal = document.getElementById('shifts-modal');
    const closeShiftsModal = document.getElementById('close-shifts-modal');
    const cancelShifts = document.getElementById('cancel-shifts');
    const saveShifts = document.getElementById('save-shifts');
    const shiftCount = document.getElementById('shift-count');
    const shiftTimeList = document.getElementById('shift-time-list');
    const shiftsSummary = document.getElementById('shifts-summary');

    let shiftTimes = [
      { start: '08:30', end: '13:00' },
      { start: '13:00', end: '17:30' },
      { start: '18:30', end: '21:30' }
    ];

    function openModal(modal) {
      modal.classList.remove('hidden');
    }

    function closeModal(modal) {
      modal.classList.add('hidden');
    }

    function setWorkdayStyle(button, active) {
      button.dataset.active = active ? 'true' : 'false';

      if (active) {
        button.classList.remove('bg-white', 'text-on-surface', 'border-outline-variant');
        button.classList.add('bg-secondary-container', 'text-on-secondary-container', 'border-primary');
      } else {
        button.classList.remove('bg-secondary-container', 'text-on-secondary-container', 'border-primary');
        button.classList.add('bg-white', 'text-on-surface', 'border-outline-variant');
      }
    }

    workdayOptions.forEach(button => {
      setWorkdayStyle(button, button.dataset.active === 'true');

      button.addEventListener('click', () => {
        const currentState = button.dataset.active === 'true';
        setWorkdayStyle(button, !currentState);
      });
    });

    openWorkdaysModal.addEventListener('click', () => openModal(workdaysModal));
    closeWorkdaysModal.addEventListener('click', () => closeModal(workdaysModal));
    cancelWorkdays.addEventListener('click', () => closeModal(workdaysModal));

    workdaysModal.addEventListener('click', event => {
      if (event.target === workdaysModal) closeModal(workdaysModal);
    });

    saveWorkdays.addEventListener('click', () => {
      const selectedDays = Array.from(workdayOptions)
        .filter(button => button.dataset.active === 'true')
        .map(button => button.dataset.day);

      workdaysSummary.textContent = selectedDays.length > 0 ? selectedDays.join('、') : '未设置';
      closeModal(workdaysModal);
    });

    function renderShiftInputs() {
      const count = Number(shiftCount.value);
      shiftTimeList.innerHTML = '';

      for (let i = 0; i < count; i++) {
        const shift = shiftTimes[i] || { start: '09:00', end: '18:00' };

        const item = document.createElement('div');
        item.className = 'rounded-xl border border-outline-variant p-3 bg-surface-container-lowest';
        item.innerHTML = `
          <p class="font-label-md text-label-md text-on-surface-variant mb-2">第 ${i + 1} 班</p>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-label-md text-label-md text-on-surface-variant mb-1">开始时间</label>
              <input type="time" class="shift-start w-full rounded-lg border border-outline-variant bg-surface-container-low px-2 py-2 text-body-md" value="${shift.start}">
            </div>
            <div>
              <label class="block font-label-md text-label-md text-on-surface-variant mb-1">结束时间</label>
              <input type="time" class="shift-end w-full rounded-lg border border-outline-variant bg-surface-container-low px-2 py-2 text-body-md" value="${shift.end}">
            </div>
          </div>
        `;

        shiftTimeList.appendChild(item);
      }
    }

    shiftCount.addEventListener('change', renderShiftInputs);

    openShiftsModal.addEventListener('click', () => {
      renderShiftInputs();
      openModal(shiftsModal);
    });

    closeShiftsModal.addEventListener('click', () => closeModal(shiftsModal));
    cancelShifts.addEventListener('click', () => closeModal(shiftsModal));

    shiftsModal.addEventListener('click', event => {
      if (event.target === shiftsModal) closeModal(shiftsModal);
    });

    saveShifts.addEventListener('click', () => {
      const startInputs = document.querySelectorAll('.shift-start');
      const endInputs = document.querySelectorAll('.shift-end');

      shiftTimes = Array.from(startInputs).map((input, index) => ({
        start: input.value,
        end: endInputs[index].value
      }));

      shiftsSummary.textContent = `${shiftTimes.length} 个班次`;
      closeModal(shiftsModal);

      console.log('默认班次设置：', shiftTimes);
    });

  const notificationToggle = document.getElementById('notification-toggle');

  notificationToggle.addEventListener('change', () => {
    console.log('通知提醒：', notificationToggle.checked ? '开启' : '关闭');
  });

  const openPasswordModal = document.getElementById('open-password-modal');
  const passwordModal = document.getElementById('password-modal');
  const closePasswordModal = document.getElementById('close-password-modal');
  const cancelPassword = document.getElementById('cancel-password');
  const savePassword = document.getElementById('save-password');

  const oldPassword = document.getElementById('old-password');
  const newPassword = document.getElementById('new-password');
  const confirmPassword = document.getElementById('confirm-password');
  const passwordError = document.getElementById('password-error');

  function openPasswordModalDialog() {
    passwordModal.classList.remove('hidden');
    passwordError.classList.add('hidden');
  }

  function closePasswordModalDialog() {
    passwordModal.classList.add('hidden');

    oldPassword.value = '';
    newPassword.value = '';
    confirmPassword.value = '';
    passwordError.classList.add('hidden');
  }

  openPasswordModal.addEventListener('click', openPasswordModalDialog);
  closePasswordModal.addEventListener('click', closePasswordModalDialog);
  cancelPassword.addEventListener('click', closePasswordModalDialog);

  passwordModal.addEventListener('click', event => {
    if (event.target === passwordModal) {
      closePasswordModalDialog();
    }
  });

  savePassword.addEventListener('click', () => {
    const oldValue = oldPassword.value.trim();
    const newValue = newPassword.value.trim();
    const confirmValue = confirmPassword.value.trim();

    if (!oldValue || !newValue || !confirmValue) {
      passwordError.textContent = '请完整填写密码信息';
      passwordError.classList.remove('hidden');
      return;
    }

    if (newValue !== confirmValue) {
      passwordError.textContent = '两次输入的新密码不一致';
      passwordError.classList.remove('hidden');
      return;
    }

    console.log('修改密码：', {
      oldPassword: oldValue,
      newPassword: newValue
    });

    closePasswordModalDialog();
  });
  </script>
</body>
</html>
